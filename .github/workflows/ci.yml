name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一ブランチの古い実行はキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lint は当面 advisory（現状 lint error が解消されるまでブロッキングにしない）
      # lint修正PRがマージされたら continue-on-error を外してブロッキング化する
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # build は必須ゲート
      - name: Build
        run: npm run build
